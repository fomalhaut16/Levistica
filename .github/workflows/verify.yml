name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check patch and script syntax
        run: |
          git diff --check
          bash -n script/build_and_run.sh script/test.sh
          python3 -m py_compile script/*.py
      - name: Build Release app
        run: CONFIGURATION=Release ./script/build_and_run.sh --build
      - name: Run unit tests
        run: ./script/test.sh --unit
      - name: Test memory attribution parser
        run: python3 -m unittest discover -s script/tests -v
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-failure
          path: .local/artifacts/
          retention-days: 3
