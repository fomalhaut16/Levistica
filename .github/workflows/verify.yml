name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measurement-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check measurement scripts
        run: |
          python3 -m py_compile script/*.py
          python3 -m unittest discover -s script/tests -v
  build-and-unit-tests:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check patch and script syntax
        run: |
          git diff --check
          bash -n script/build_and_run.sh script/test.sh
      - name: Check numeric-only memory observation on macOS
        run: python3 -m unittest discover -s script/tests -p test_observe_memory.py -v
      - name: Check isolated bundle exchange on macOS
        run: python3 -m unittest discover -s script/tests -p test_rehearse_update.py -v
      - name: Check first-install safeguards and exclusive rename on macOS
        run: python3 -m unittest discover -s script/tests -p test_install_local.py -v
      - name: Build Release app
        run: CONFIGURATION=Release ./script/build_and_run.sh --build
      - name: Verify normal Release security baseline
        run: python3 script/check-release-security.py
      - name: Build isolated profiling app
        run: CONFIGURATION=Release LEVISTICA_EPHEMERAL=1 LEVISTICA_PROFILE=1 ./script/build_and_run.sh --build
      - name: Build isolated measurement app without debugger entitlement
        run: CONFIGURATION=Release LEVISTICA_EPHEMERAL=1 LEVISTICA_MEASUREMENT=1 ./script/build_and_run.sh --build
      - name: Package and validate local archive without launching apps
        run: CONFIGURATION=Release ./script/build_and_run.sh --package-local
      - name: Rehearse signed bundle replacement and rollback on private copies
        shell: bash
        run: |
          shopt -s nullglob
          archives=(.local/archives/local-*/Levistica.xcarchive)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo 'Expected exactly one archive from this fresh CI checkout.' >&2
            exit 1
          fi
          python3 script/check-release-security.py --app "${archives[0]}/Products/Applications/Levistica.app"
          python3 script/rehearse-update.py --archive "${archives[0]}"
      - name: Run unit tests
        run: ./script/test.sh --unit
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-failure
          path: .local/artifacts/
          retention-days: 3
